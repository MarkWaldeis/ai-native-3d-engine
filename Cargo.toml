[package]
name = "ai-engine"
version = "0.1.0"
edition = "2021"
description = "AI-native 3D game engine prototype (v0.1 vertical slice)"
license = "MIT"
repository = "https://github.com/MarkWaldeis/ai-native-3d-engine"
keywords = ["game-engine", "mcp", "wgpu", "ecs", "ai"]

[workspace]
members = [
    "crates/engine-terrain",
    "shared",
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-mcp",
    "crates/engine-geo",
    "crates/asset-pipeline",
    "crates/engine-tests",
    "crates/engine-runtime",
    "crates/engine-net",
    "crates/engine-web",
]

[dependencies]
shared = { path = "shared" }
engine-core = { path = "crates/engine-core" }
engine-render = { path = "crates/engine-render" }
engine-mcp = { path = "crates/engine-mcp" }
engine-geo = { path = "crates/engine-geo" }
asset-pipeline = { path = "crates/asset-pipeline" }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"
getrandom = "0.2"
engine-runtime = { path = "crates/engine-runtime" }
engine-terrain = { path = "crates/engine-terrain" }
