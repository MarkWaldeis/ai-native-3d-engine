[package]
name = "engine-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../../shared" }
engine-geo = { path = "../engine-geo" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rapier3d = { version = "0.22", features = ["enhanced-determinism"] }
rhai = { version = "=1.20.1", default-features = false, features = ["std", "serde", "no_module", "no_time"] }
