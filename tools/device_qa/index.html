<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>Geräte-QA · AI Engine</title>
<style>body{margin:0;font:16px system-ui;background:#142a34;color:#fff}header,details{padding:.6rem}header{position:fixed;top:36px;left:0;right:0;z-index:2;max-height:calc(100svh - 58px);overflow:auto;background:#142a34}button,a,input,select{font:inherit;margin:.25rem}button,a{padding:.4rem}a{color:#b8f5cc}iframe{position:fixed;inset:0;display:block;border:0;width:100%;height:100svh}label{display:inline-block}textarea{width:95%;height:4rem}#status{padding:.3rem}#download[hidden],header[hidden]{display:none}#toggle{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:3;font-size:12px;margin:0;padding:3px 8px}</style></head>
<body><button id="toggle" aria-controls="panel" aria-expanded="true" disabled>Spiel anzeigen</button><header id="panel"><strong>Geräte-QA (freiwillig, lokal)</strong><p id="status" role="status">Recorder wird verbunden. Noch nicht spielen.</p>
<button id="stop" disabled>Aufnahme beenden / Bericht vorbereiten</button><a id="download" hidden download="device-qa.json">JSON herunterladen</a><button id="share" disabled>Bericht teilen</button><button id="restart">Neue Aufnahme (Neustart)</button>
<details><summary>Checkliste und eigene Angaben</summary><label><input id="physical" type="checkbox">Ich teste auf einem echten Gerät (Selbstauskunft)</label><div id="checks"></div><label>Gerät/OS, Beobachtungen (keine persönlichen Daten)<br><textarea id="notes" maxlength="2000"></textarea></label><p>Keine automatische Übertragung. Der Bericht enthält Browser-/Viewportdaten, logische Spieleingaben, begrenzte Zustandsproben und Fehlermeldungen. Vor dem Teilen prüfen.</p></details></header>
<iframe id="game" title="Spiel für Geräte-QA" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe><script type="module" src="./companion.mjs"></script></body></html>
