name: Web demo · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install matching WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Export coin collector
        run: rm -rf target/site && cargo run -- --export-web examples/coin_game/scene.json target/site/coin_game
      - name: Export Sky Garden
        run: cargo run -- --export-web examples/sky_garden/scene.json target/site/sky_garden
      - name: Add German landing page
        run: cp crates/engine-web/landing.html target/site/index.html && touch target/site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
